# Blog redirects
# One per-year to scope this to old blog links only (otherwise we also match the new blog links!)
[[redirects]]
  from = "/2019/:month/:day/:slug"
  to = "/blog/2019/:month/:slug"

[[redirects]]
  from = "/2018/:month/:day/:slug"
  to = "/blog/2018/:month/:slug"

[[redirects]]
  from = "/2017/:month/:day/:slug"
  to = "/blog/2017/:month/:slug"

[[redirects]]
  from = "/2016/:month/:day/:slug"
  to = "/blog/2016/:month/:slug"

# Link post redirects
# 1 per-post
[[redirects]]
  from = "/links/2019/20191108/"
  to = "/blog/2019/11/interesting-links-november-2019/"

[[redirects]]
  from = "/links/2019/20191201/"
  to = "/blog/2019/12/interesting-links-december-2019/"

[[redirects]]
  from = "/links/2019/20191219/"
  to = "/blog/2019/12/more-interesting-links-december-2019/"

[[redirects]]
  from = "/links/2020/20200207/"
  to = "/blog/2020/02/interesting-links-february-2020/"

# There is no more archive page (/blog shows every post)
[[redirects]]
  from = "/blog/archive"
  to = "/blog"

# Slug tidy-ups (October 2026): typos, a leftover .1 suffix, mixed case and triple dashes.
# Deliberately no 'force = true': the new paths exist as files, so Netlify's shadowing
# serves them directly and the case-only renames can't loop back on themselves.

[[redirects]]
  from = "/blog/2018/01/changing-the-owner-of-an-ssrs-subscription-with-powershell.1"
  to = "/blog/2018/01/changing-the-owner-of-an-ssrs-subscription-with-powershell/"

[[redirects]]
  from = "/blog/2018/07/ensuing-your-describe-tags-are-unique-in-pester-tests"
  to = "/blog/2018/07/ensuring-your-describe-tags-are-unique-in-pester-tests/"

[[redirects]]
  from = "/blog/2019/11/interesting-links-November-2019"
  to = "/blog/2019/11/interesting-links-november-2019/"

[[redirects]]
  from = "/blog/2020/05/tips-for-1-on-1s-during-COVID-10"
  to = "/blog/2020/05/tips-for-1-on-1s-during-covid-19/"

[[redirects]]
  from = "/blog/2020/10/interesting-links-October-2020"
  to = "/blog/2020/10/interesting-links-october-2020/"

[[redirects]]
  from = "/blog/2021/08/interesting-links---august-2021"
  to = "/blog/2021/08/interesting-links-august-2021/"

[[redirects]]
  from = "/blog/2021/11/interesting-links---november-2021"
